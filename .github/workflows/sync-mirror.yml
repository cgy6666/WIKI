name: Sync OI-Wiki Source & Static Site

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream

      # ========== 同步1：上游 gh-pages → 本地 gh-pages（网站静态页面）
      - name: Sync upstream/gh-pages -> origin/gh-pages
        run: |
          git checkout gh-pages
          git reset --hard upstream/gh-pages
          # 清理上游自带.github 规避workflow推送权限报错
          rm -rf .github
          # 恢复自定义域名CNAME
          echo "shturl.cc/h9A9Ft2mWyO" > CNAME
          git add .
          git commit -m "Auto sync static site from upstream gh-pages" || echo "No static changes"

      # ========== 同步2：上游 master → 本地 source（OI-Wiki Markdown源码）
      - name: Sync upstream/master -> origin/source
        run: |
          # 如果不存在source分支则新建
          git checkout -B source upstream/master
          git add .
          git commit -m "Auto sync source code from upstream master" || echo "No source changes"

      # 推送两个分支
      - name: Push all synced branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin gh-pages --force
          git push origin source --force
