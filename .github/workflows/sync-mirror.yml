name: Sync OI-Wiki Mirror

on:
  push:
    branches: [ main ]
  schedule:
    # 每2小时同步一次
    - cron: '0 */2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Pull latest upstream OI-Wiki
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream
          git reset --hard upstream/master

      # 关键：自动重建CNAME，防止被覆盖
      - name: Restore custom domain CNAME
        run: echo "shturl.cc/HEJA7iyY81D" > CNAME

      - name: Push changes to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto sync upstream & restore CNAME" || echo "No changes to commit"
          git push origin gh-pages --force
