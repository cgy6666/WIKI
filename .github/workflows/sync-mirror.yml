name: Sync OI Wiki Mirror

on:
  push:
    branches: [ main ]
  schedule:
    # 每6小时自动同步，按需调整 cron
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 身份
        run: |
          git config --global user.name "Mirror Bot"
          git config --global user.email "mirror@example.com"

      - name: 拉取上游 OI-Wiki gh-pages
        run: |
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream gh-pages
          git reset --hard upstream/gh-pages

      - name: 强制写入自定义域名 CNAME
        run: |
          echo "oi-wiki.xqyhcc.qzz.io" > CNAME

      - name: 生成SPA路由兜底404.html（修复子页面刷新白屏）
        run: |
          cat > 404.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OI Wiki</title>
<script>
(function(){
  var loc = window.location;
  var target = loc.protocol + "//" + loc.host + "/?" + loc.pathname.slice(1) + loc.search + loc.hash;
  loc.replace(target);
})();
</script>
</head>
<body></body>
</html>
EOF

      - name: 页面自动修复脚本
        run: |
          # Google Fonts → loli 国内镜像
          find . -type f -name "*.html" | xargs sed -i 's|fonts.googleapis.com|fonts.loli.net|g'
          # 删除反馈系统，根除大量CORS异常
          find . -type f -name "*.html" | xargs sed -i '/oiwiki-feedback-sys-frontend.js/d'

      - name: 提交更新
        run: |
          git add .
          git commit -m "🔄 同步上游 OI Wiki｜修复页面渲染、路由、字体、跨域报错" || true

      - name: Push 更新
        run: |
          git push origin HEAD:gh-pages --force
