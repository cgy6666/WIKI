name: Sync OI-Wiki Mirror
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync_website:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki/OI-wiki.git
          git fetch upstream
      - name: Sync upstream gh-pages to gh-pages
        run: |
          git switch -C gh-pages upstream/gh-pages
          rm -rf .github
          echo "oi-wiki.xqyhcc.qzz.io" > CNAME
          git add .
          git commit -m "Sync official static site" || true
          git push origin gh-pages --force

  sync_source_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout @v4
        with:
          fetch-depth: 0
      - name: Setup upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream
      - name: Sync upstream master to source branch
        run: |
          git switch -C source upstream/master
          git add .
          git commit -m "Backup OI-Wiki markdown source" || true
          git push origin source --force
