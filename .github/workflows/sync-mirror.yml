name: Sync OI-Wiki Mirror
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取官方OI-wiki gh-pages分支静态文件
        uses: actions/checkout@v4
        with:
          repository: OI-wiki/OI-wiki
          ref: gh-pages
          path: source

      - name: 检出本仓库gh-pages分支
        uses: actions/checkout@v4
        with:
          path: dest
          branch: gh-pages

      - name: 覆盖同步文件
        run: |
          rm -rf dest/*
          cp -r source/* dest/
          cd dest
          git config user.name "Mirror Bot"
          git config user.email "mirror@example.com"
          git add .
          git commit -m "Sync upstream OI-wiki gh-pages" || echo "内容无更新"
          git push
