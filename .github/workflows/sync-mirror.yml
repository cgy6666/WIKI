name: Sync OI-Wiki Mirror
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync_website:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Git提交身份
        run: |
          git config --global user.name "Mirror Bot"
          git config --global user.email "mirror@example.com"

      - name: 添加上游OI-wiki仓库
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream

      - name: 同步静态页面到gh-pages
        run: |
          git switch -C gh-pages upstream/gh-pages
          rm -rf .github
          echo "oi-wiki.xqyhcc.qzz.io" > CNAME
          echo "/*    /index.html   200" > _redirects
          git add .
          git commit -m "同步OI-Wiki静态站点" || true
          git push origin gh-pages --force

  sync_source_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Git提交身份
        run: |
          git config --global user.name "Mirror Bot"
          git config --global user.email "mirror@example.com"

      - name: 添加上游OI-wiki仓库
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OI-wiki/OI-wiki.git
          git fetch upstream

      - name: 备份源码到source分支
        run: |
          git switch -C source upstream/master
          rm -rf .github
          git add .
          git commit -m "备份OI-Wiki源码" || true
          git push origin source --force
